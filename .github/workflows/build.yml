name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A tag like v1.2.3 sets the version of the exe and the installer.
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
            if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tags must look like v1.2.3, got $env:GITHUB_REF_NAME" }
            Set-Content -Path src/Version.cs -Encoding utf8 -Value @(
              'using System.Reflection;',
              '',
              ('[assembly: AssemblyVersion("' + $v + '.0")]'),
              ('[assembly: AssemblyFileVersion("' + $v + '.0")]'),
              ('[assembly: AssemblyInformationalVersion("' + $v + '")]')
            )
          } else {
            $m = Select-String -Path src/Version.cs -Pattern 'AssemblyInformationalVersion\("([^"]+)"\)'
            $v = $m.Matches[0].Groups[1].Value
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      # Same script as on a developer machine: the C# compiler that ships with Windows.
      - name: Build exe
        shell: cmd
        run: build.bat

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not found" }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.value }}" installer\Brighter.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Brighter-${{ steps.version.outputs.value }}
          path: |
            bin/Brighter.exe
            dist/Brighter-Setup-*.exe
          if-no-files-found: error

      # Pushing a tag like v1.0.0 publishes a release with both files attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Brighter-Setup-${{ steps.version.outputs.value }}.exe
            bin/Brighter.exe
          generate_release_notes: true
